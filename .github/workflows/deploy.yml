name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. Frontend Build ───────────────────────────────────────────────────

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React production bundle
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          rm -rf dist
          npm run build
          # Copy SPA rewrite rules into the build output
          cp public/.htaccess dist/.htaccess

      # ── 2. Backend Dependencies (Composer) ──────────────────────────────────

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install Composer dependencies locally
        working-directory: backend
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-dev \
            --optimize-autoloader

      # ── 3. Package Archives for Fast FTP Transfer ───────────────────────────

      - name: Install zip and lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip lftp

      - name: Create deployment packages
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          # Package frontend
          cd frontend/dist
          zip -r -q ../../frontend.zip .
          cd ../..

          # Package backend (excluding local/temporary files)
          cd backend
          zip -r -q ../backend.zip . \
            -x ".env*" \
            -x ".git/*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*" \
            -x "bootstrap/cache/*"
          cd ..

          # Prepare deploy runner script with secret
          sed "s|__DEPLOY_SECRET__|${DEPLOY_WEBHOOK_SECRET}|g" \
            deploy/deploy-runner.php > deploy-runner.php

          echo "Deployment package sizes:"
          ls -lh frontend.zip backend.zip deploy-runner.php

      # ── 4. Upload Packages via FTP ──────────────────────────────────────────

      - name: Upload deployment packages to Hostinger via FTP
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.HOSTINGER_FTP_PORT }}
          RAW_PATH: ${{ secrets.HOSTINGER_PUBLIC_PATH }}
        run: |
          # Normalize path: remove any leading /home/username/ prefix for FTP
          CLEAN_PATH=$(echo "${RAW_PATH}" | sed -E 's|^/home/[^/]+/||' | sed -E 's|^/||' | sed -E 's|/$||')
          echo "Connecting to FTP and navigating to: ${CLEAN_PATH}"

          lftp -c "
            set ftp:ssl-allow yes
            set ftp:ssl-force no
            set ssl:verify-certificate no
            set net:max-retries 3
            set net:reconnect-interval-base 5
            open -u '${FTP_USER}','${FTP_PASS}' -p '${FTP_PORT}' '${FTP_HOST}'
            
            # Try configured path, fallback to domains/inveniqlab.com/public_html or public_html
            cd '${CLEAN_PATH}' || cd 'domains/inveniqlab.com/public_html' || cd 'public_html' || cd '/'
            pwd
            
            # Upload deployment archives
            put -O . frontend.zip
            put -O . backend.zip
            put -O . deploy-runner.php
            
            ls -la
            bye
          "

      # ── 5. Trigger Remote Extraction & Artisan Execution ────────────────────

      - name: Execute remote extraction and Laravel post-deployment
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          echo "Calling deployment runner on server..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://inveniqlab.com/deploy-runner.php" \
            -H "Authorization: Bearer ${DEPLOY_WEBHOOK_SECRET}" \
            --max-time 180)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status Code: ${HTTP_CODE}"
          echo "Server Response:"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Deployment runner failed with HTTP status ${HTTP_CODE}"
            exit 1
          fi

          echo "Deployment and post-deployment commands completed successfully!"
