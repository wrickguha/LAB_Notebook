name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. Frontend Build ───────────────────────────────────────────────────

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React production bundle
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          rm -rf dist
          npm run build
          # Copy SPA rewrite rules into the build output
          cp public/.htaccess dist/.htaccess

      # ── 2. Backend Dependencies (Composer) ──────────────────────────────────

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install Composer dependencies locally
        working-directory: backend
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-dev \
            --optimize-autoloader

      # ── 3. Package Archives for Fast Transfer ───────────────────────────────

      - name: Create deployment packages
        run: |
          # Package frontend
          cd frontend/dist
          zip -r -q ../../frontend.zip .
          cd ../..

          # Package backend (excluding local/temporary files)
          cd backend
          zip -r -q ../backend.zip . \
            -x ".env*" \
            -x ".git/*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*" \
            -x "bootstrap/cache/*"
          cd ..

          echo "Deployment package sizes:"
          ls -lh frontend.zip backend.zip

      # ── 4. Direct SSH Deployment & Artisan Execution ────────────────────────

      - name: Deploy to Hostinger via SSH
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          PUBLIC_PATH: ${{ secrets.HOSTINGER_PUBLIC_PATH }}
        run: |
          # Fallback default port for Hostinger SSH is 65002
          PORT="${SSH_PORT:-65002}"

          echo "Configuring SSH connection to ${SSH_USER}@${SSH_HOST}:${PORT}..."
          mkdir -p ~/.ssh
          echo "${SSH_KEY}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "Transferring deployment packages via SCP..."
          scp -P "${PORT}" -i ~/.ssh/id_rsa frontend.zip backend.zip "${SSH_USER}@${SSH_HOST}:~/"

          echo "Executing remote extraction and Laravel configuration on Hostinger..."
          ssh -p "${PORT}" -i ~/.ssh/id_rsa "${SSH_USER}@${SSH_HOST}" 'bash -s' << 'ENDSSH'
          set -e

          # 1. Determine public_html directory
          PUBLIC_DIR=""
          for p in "$HOME/domains/inveniqlab.com/public_html" "$HOME/public_html"; do
            if [ -d "$p" ]; then
              PUBLIC_DIR="$p"
              break
            fi
          done
          if [ -z "$PUBLIC_DIR" ]; then
            PUBLIC_DIR="$HOME/public_html"
            mkdir -p "$PUBLIC_DIR"
          fi

          # 2. Determine laravel directory (outside public_html)
          DOMAIN_DIR="$(dirname "$PUBLIC_DIR")"
          LARAVEL_DIR="$DOMAIN_DIR/laravel"
          mkdir -p "$LARAVEL_DIR" "$PUBLIC_DIR/api"

          echo "Public directory: $PUBLIC_DIR"
          echo "Laravel directory: $LARAVEL_DIR"

          # 3. Extract Frontend into public_html
          unzip -o -q ~/frontend.zip -d "$PUBLIC_DIR"
          rm -f ~/frontend.zip

          # 4. Extract Backend into laravel/
          unzip -o -q ~/backend.zip -d "$LARAVEL_DIR"
          rm -f ~/backend.zip

          # 5. Write public_html/api/index.php
          cat << 'EOF' > "$PUBLIC_DIR/api/index.php"
<?php
define('LARAVEL_START', microtime(true));

$laravelPath = dirname(__DIR__, 2) . '/laravel';
if (!is_dir($laravelPath)) {
    $laravelPath = dirname(__DIR__) . '/laravel';
}
if (file_exists($m = $laravelPath . '/storage/framework/maintenance.php')) {
    require $m;
}
require $laravelPath . '/vendor/autoload.php';
$app = require_once $laravelPath . '/bootstrap/app.php';
$app->handleRequest(Illuminate\Http\Request::capture());
EOF

          # 6. Write public_html/api/.htaccess
          cat << 'EOF' > "$PUBLIC_DIR/api/.htaccess"
<IfModule mod_rewrite.c>
    <IfModule mod_negotiation.c>
        Options -MultiViews -Indexes
    </IfModule>
    RewriteEngine On
    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    RewriteCond %{HTTP:x-xsrf-token} .
    RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_URI} (.+)/$
    RewriteRule ^ %1 [L,R=301]
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ index.php [L]
</IfModule>
EOF

          # 7. Create required Laravel directories
          mkdir -p "$LARAVEL_DIR/storage/app/public" \
                   "$LARAVEL_DIR/storage/framework/cache/data" \
                   "$LARAVEL_DIR/storage/framework/sessions" \
                   "$LARAVEL_DIR/storage/framework/views" \
                   "$LARAVEL_DIR/storage/logs" \
                   "$LARAVEL_DIR/bootstrap/cache"

          # 8. Ensure .env exists
          if [ ! -f "$LARAVEL_DIR/.env" ] && [ -f "$LARAVEL_DIR/.env.example" ]; then
            cp "$LARAVEL_DIR/.env.example" "$LARAVEL_DIR/.env"
            echo "Created initial .env from .env.example"
          fi

          # 9. Run Artisan Commands
          cd "$LARAVEL_DIR"
          php artisan storage:link 2>&1 || true
          php artisan config:cache 2>&1 || true
          php artisan route:cache 2>&1 || true
          php artisan view:cache 2>&1 || true
          php artisan migrate --force 2>&1 || true

          # 10. Set proper permissions
          chmod -R 775 storage bootstrap/cache
          echo "Hostinger deployment and Laravel optimization completed successfully!"
          ENDSSH
