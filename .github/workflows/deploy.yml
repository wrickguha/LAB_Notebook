name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 22
      PHP_VERSION: '8.2'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, ctype, json, tokenizer, pdo_mysql, dom, fileinfo, xml, curl, gd
          coverage: none

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend production bundle
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          rm -rf dist
          npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev

      - name: Prepare backend .env for production
        working-directory: backend
        run: |
          cp .env.example .env.production || true
          cat > .env <<'EOF'
          APP_NAME="${{ secrets.APP_NAME }}"
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL }}

          LOG_CHANNEL=stack
          LOG_LEVEL=debug

          DB_CONNECTION=mysql
          # Database credentials are configured in the live Hostinger .env file.
          # Keep DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME and DB_PASSWORD in the server-side .env.

          SESSION_DRIVER=database
          QUEUE_CONNECTION=database
          CACHE_STORE=database
          FILESYSTEM_DISK=local

          MAIL_MAILER=log
          MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME="${{ secrets.APP_NAME }}"
          EOF

      - name: Deploy frontend and backend via SSH + rsync
        shell: bash
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_PUBLIC_PATH: ${{ secrets.HOSTINGER_PUBLIC_PATH }}
          HOSTINGER_API_PATH: ${{ secrets.HOSTINGER_API_PATH }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          : "${HOSTINGER_SSH_HOST:?HOSTINGER_SSH_HOST is required for SSH deployment.}"
          : "${HOSTINGER_SSH_USER:?HOSTINGER_SSH_USER is required for SSH deployment.}"
          : "${HOSTINGER_SSH_KEY:?HOSTINGER_SSH_KEY is required for SSH deployment.}"

          HOSTINGER_SSH_PORT="${HOSTINGER_SSH_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${HOSTINGER_SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${HOSTINGER_SSH_PORT}" "${HOSTINGER_SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

          HOSTINGER_PUBLIC_PATH="${HOSTINGER_PUBLIC_PATH:-}"
          HOSTINGER_API_PATH="${HOSTINGER_API_PATH:-}"

          if [ -z "${HOSTINGER_PUBLIC_PATH}" ]; then
            HOSTINGER_PUBLIC_PATH="$(ssh -p "${HOSTINGER_SSH_PORT}" -i ~/.ssh/id_rsa "${HOSTINGER_SSH_USER}@${HOSTINGER_SSH_HOST}" "for p in \$HOME/public_html /home/*/public_html /home/*/domains/*/public_html; do [ -d \"\$p\" ] && { echo \"\$p\"; break; }; done")"
          fi

          if [ -z "${HOSTINGER_API_PATH}" ]; then
            HOSTINGER_API_PATH="$(ssh -p "${HOSTINGER_SSH_PORT}" -i ~/.ssh/id_rsa "${HOSTINGER_SSH_USER}@${HOSTINGER_SSH_HOST}" "for p in /home/*/domains/*/public_html /home/*/public_html /home/*/api/public_html; do [ -d \"\$p\" ] && { echo \"\$p\"; break; }; done")"
          fi

          if [ -z "${HOSTINGER_PUBLIC_PATH}" ] || [ -z "${HOSTINGER_API_PATH}" ]; then
            echo "::error::Could not auto-detect Hostinger public and API paths. Set HOSTINGER_PUBLIC_PATH and HOSTINGER_API_PATH secrets."
            exit 1
          fi

          echo "Using public root: ${HOSTINGER_PUBLIC_PATH}"
          echo "Using API root: ${HOSTINGER_API_PATH}"

          ssh -p "${HOSTINGER_SSH_PORT}" -i ~/.ssh/id_rsa "${HOSTINGER_SSH_USER}@${HOSTINGER_SSH_HOST}" \
            "mkdir -p '${HOSTINGER_PUBLIC_PATH}' '${HOSTINGER_API_PATH}' && \
             find '${HOSTINGER_PUBLIC_PATH}' -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec rm -rf {} + && \
             find '${HOSTINGER_API_PATH}' -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec rm -rf {} +"

          rsync -a --delete --compress --info=stats2 \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.example' \
            --exclude 'node_modules/' \
            --exclude 'vendor/' \
            --exclude 'storage/' \
            --exclude 'bootstrap/cache/' \
            --exclude 'tests/' \
            -e "ssh -p ${HOSTINGER_SSH_PORT} -i ~/.ssh/id_rsa" \
            frontend/dist/ "${HOSTINGER_SSH_USER}@${HOSTINGER_SSH_HOST}:${HOSTINGER_PUBLIC_PATH}/"

          rsync -a --delete --compress --info=stats2 \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.example' \
            --exclude 'node_modules/' \
            --exclude 'vendor/' \
            --exclude 'storage/' \
            --exclude 'bootstrap/cache/' \
            --exclude 'tests/' \
            -e "ssh -p ${HOSTINGER_SSH_PORT} -i ~/.ssh/id_rsa" \
            backend/ "${HOSTINGER_SSH_USER}@${HOSTINGER_SSH_HOST}:${HOSTINGER_API_PATH}/"

      - name: Post deployment note
        run: |
          echo "SSH + rsync deployment started. This version uploads the app files only and does not run Laravel commands on the server."
          echo "Please update the live Hostinger .env manually before testing the production app."
