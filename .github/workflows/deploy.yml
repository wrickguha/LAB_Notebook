name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Frontend build ───────────────────────────────────────────────────────

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React production bundle
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          rm -rf dist
          npm run build
          # Copy SPA rewrite rules into the build output
          cp public/.htaccess dist/.htaccess

      # ── Backend preparation (Composer runs locally) ──────────────────────────

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install Composer dependencies locally
        working-directory: backend
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-dev \
            --optimize-autoloader

      # ── Prepare API entry point & deploy webhook ─────────────────────────────

      - name: Prepare API entry point and webhook
        env:
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          mkdir -p frontend/dist/api

          # Laravel API entry point — replace placeholder path
          sed "s|__LARAVEL_PATH__|${HOSTINGER_DEPLOY_PATH}|g" \
            deploy/api-entry.php > frontend/dist/api/index.php

          # Laravel's .htaccess for the api/ subdirectory
          cp backend/public/.htaccess frontend/dist/api/.htaccess

          # Deploy webhook — replace both placeholders
          sed -e "s|__LARAVEL_PATH__|${HOSTINGER_DEPLOY_PATH}|g" \
              -e "s|__DEPLOY_SECRET__|${DEPLOY_WEBHOOK_SECRET}|g" \
            deploy/deploy-webhook.php > frontend/dist/api/deploy-hook.php

      # ── Deploy frontend → public_html via FTP ───────────────────────────────
      # Uses lftp mirror (similar to rsync --delete).
      # Excludes .well-known/ (SSL certs) and api/ since we handle it below.

      - name: Deploy frontend to public_html
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.HOSTINGER_FTP_PORT }}
          PUBLIC_PATH: ${{ secrets.HOSTINGER_PUBLIC_PATH }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes
            set ftp:ssl-force no
            set ssl:verify-certificate no
            set net:max-retries 3
            set net:reconnect-interval-base 5
            set mirror:parallel-transfer-count 5
            open -u '${FTP_USER}','${FTP_PASS}' -p '${FTP_PORT}' '${FTP_HOST}'
            mirror --reverse --delete --verbose \
              --exclude-glob .well-known/ \
              frontend/dist/ '${PUBLIC_PATH}/'
            bye
          "

      # ── Deploy backend → Laravel directory via FTP ──────────────────────────
      # Excludes .env, storage runtime dirs, tests, .git etc.

      - name: Deploy backend to Laravel directory
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.HOSTINGER_FTP_PORT }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes
            set ftp:ssl-force no
            set ssl:verify-certificate no
            set net:max-retries 3
            set net:reconnect-interval-base 5
            set mirror:parallel-transfer-count 5
            open -u '${FTP_USER}','${FTP_PASS}' -p '${FTP_PORT}' '${FTP_HOST}'
            mirror --reverse --delete --verbose \
              --exclude-glob .env \
              --exclude-glob '.env.*' \
              --exclude-glob node_modules/ \
              --exclude-glob 'storage/logs/*' \
              --exclude-glob 'storage/framework/cache/*' \
              --exclude-glob 'storage/framework/sessions/*' \
              --exclude-glob 'storage/framework/views/*' \
              --exclude-glob 'bootstrap/cache/*' \
              --exclude-glob tests/ \
              --exclude-glob .git/ \
              backend/ '${DEPLOY_PATH}/'
            bye
          "

      # ── Run post-deployment artisan commands via webhook ────────────────────

      - name: Run Laravel post-deployment commands
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          echo "Waiting 10s for FTP to settle..."
          sleep 10

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://inveniqlab.com/api/deploy-hook.php" \
            -H "Authorization: Bearer ${DEPLOY_WEBHOOK_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 120)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: ${HTTP_CODE}"
          echo "Response:"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Deploy webhook returned HTTP ${HTTP_CODE}"
            exit 1
          fi

          echo "Post-deployment commands completed successfully."
