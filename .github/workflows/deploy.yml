name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Frontend build ───────────────────────────────────────────────────────

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React production bundle
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          rm -rf dist
          npm run build
          # Copy SPA rewrite rules into the build output
          cp public/.htaccess dist/.htaccess

      # ── SSH setup ────────────────────────────────────────────────────────────

      - name: Configure SSH agent
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${HOSTINGER_SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${HOSTINGER_SSH_PORT:-22}" "${HOSTINGER_SSH_HOST}" \
            >> ~/.ssh/known_hosts 2>/dev/null

      # ── Deploy React build → public_html ─────────────────────────────────────
      # --exclude 'api/' preserves the Laravel entry point on re-deploys.

      - name: Deploy frontend to public_html
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_PUBLIC_PATH: ${{ secrets.HOSTINGER_PUBLIC_PATH }}
        run: |
          SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          rsync -az --delete --compress \
            --exclude '.well-known/' \
            --exclude 'api/' \
            -e "ssh -p ${SSH_PORT} -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new" \
            frontend/dist/ \
            "${HOSTINGER_SSH_USER}@${HOSTINGER_SSH_HOST}:${HOSTINGER_PUBLIC_PATH}/"

      # ── Deploy backend → ~/laravel (outside public_html) ─────────────────────
      # --exclude '.env' preserves the server's production .env (DB creds etc.).
      # vendor/ is excluded here; Composer runs on the server in a later step.

      - name: Deploy backend to Laravel directory
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_LARAVEL_PATH: ${{ secrets.HOSTINGER_LARAVEL_PATH }}
        run: |
          SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          rsync -az --delete --compress \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'vendor/' \
            --exclude 'node_modules/' \
            --exclude 'storage/logs/*' \
            --exclude 'storage/framework/cache/*' \
            --exclude 'storage/framework/sessions/*' \
            --exclude 'storage/framework/views/*' \
            --exclude 'bootstrap/cache/*' \
            --exclude 'tests/' \
            --exclude '.git' \
            -e "ssh -p ${SSH_PORT} -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new" \
            backend/ \
            "${HOSTINGER_SSH_USER}@${HOSTINGER_SSH_HOST}:${HOSTINGER_LARAVEL_PATH}/"

      # ── Publish Laravel API entry point in public_html/api/ ──────────────────
      # deploy/api-entry.php template has __LARAVEL_PATH__ replaced by sed.

      - name: Publish Laravel API entry point
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_PUBLIC_PATH: ${{ secrets.HOSTINGER_PUBLIC_PATH }}
          HOSTINGER_LARAVEL_PATH: ${{ secrets.HOSTINGER_LARAVEL_PATH }}
        run: |
          SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          SCP="scp -P ${SSH_PORT} -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new"
          SSH="ssh -p ${SSH_PORT} -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new"
          TARGET="${HOSTINGER_SSH_USER}@${HOSTINGER_SSH_HOST}"

          $SSH "$TARGET" "mkdir -p '${HOSTINGER_PUBLIC_PATH}/api'"

          # Laravel's own rewrite rules handle routing inside api/
          $SCP backend/public/.htaccess \
            "$TARGET:${HOSTINGER_PUBLIC_PATH}/api/.htaccess"

          # Inject the real server path and upload the entry point
          sed "s|__LARAVEL_PATH__|${HOSTINGER_LARAVEL_PATH}|g" \
            deploy/api-entry.php > /tmp/api-index.php
          $SCP /tmp/api-index.php "$TARGET:${HOSTINGER_PUBLIC_PATH}/api/index.php"

      # ── Server-side Composer + artisan ───────────────────────────────────────

      - name: Install Composer dependencies on server
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_LARAVEL_PATH: ${{ secrets.HOSTINGER_LARAVEL_PATH }}
        run: |
          SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          ssh -p "${SSH_PORT}" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new \
            "${HOSTINGER_SSH_USER}@${HOSTINGER_SSH_HOST}" \
            "cd '${HOSTINGER_LARAVEL_PATH}' && \
             composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader"

      - name: Run Laravel post-deployment commands
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_LARAVEL_PATH: ${{ secrets.HOSTINGER_LARAVEL_PATH }}
        run: |
          SSH_PORT="${HOSTINGER_SSH_PORT:-22}"
          LARAVEL="${HOSTINGER_LARAVEL_PATH}"
          ssh -p "${SSH_PORT}" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new \
            "${HOSTINGER_SSH_USER}@${HOSTINGER_SSH_HOST}" \
            "set -euo pipefail
             cd '${LARAVEL}'
             mkdir -p storage/app/public storage/framework/cache \
                      storage/framework/sessions storage/framework/views \
                      storage/logs bootstrap/cache
             php artisan config:cache
             php artisan route:cache
             php artisan view:cache
             php artisan migrate --force
             [ -L public/storage ] || php artisan storage:link
             chmod -R 775 storage bootstrap/cache
             find storage -type f -exec chmod 664 {} \;
             echo 'Deployment complete.'"
