name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 22
      PHP_VERSION: '8.2'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, ctype, json, tokenizer, pdo_mysql, dom, fileinfo, xml, curl, gd
          coverage: none

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend production bundle
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev

      - name: Prepare backend .env for production
        working-directory: backend
        run: |
          cp .env.example .env.production || true
          cat > .env <<'EOF'
          APP_NAME="${{ secrets.APP_NAME }}"
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL }}

          LOG_CHANNEL=stack
          LOG_LEVEL=debug

          DB_CONNECTION=mysql
          # Database credentials are configured in the live Hostinger .env file.
          # Keep DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME and DB_PASSWORD in the server-side .env.

          SESSION_DRIVER=database
          QUEUE_CONNECTION=database
          CACHE_STORE=database
          FILESYSTEM_DISK=local

          MAIL_MAILER=log
          MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME="${{ secrets.APP_NAME }}"
          EOF

      - name: Create deployment archive
        run: |
          mkdir -p deploy
          cp -r backend deploy/backend
          cp -r frontend/dist deploy/frontend
          tar -czf deploy.tar.gz -C deploy .

      - name: Deploy frontend and backend via FTP
        shell: bash
        env:
          HOSTINGER_FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_PUBLIC_PATH: ${{ secrets.HOSTINGER_PUBLIC_PATH }}
          HOSTINGER_API_PATH: ${{ secrets.HOSTINGER_API_PATH }}
        run: |
          set -e

          if [ -z "${HOSTINGER_FTP_HOST}" ] || [ -z "${HOSTINGER_FTP_USERNAME}" ] || [ -z "${HOSTINGER_FTP_PASSWORD}" ]; then
            echo "::error::HOSTINGER_FTP_HOST, HOSTINGER_FTP_USERNAME, and HOSTINGER_FTP_PASSWORD must all be configured for FTP deployment."
            exit 1
          fi

          if [ -z "${HOSTINGER_PUBLIC_PATH}" ] || [ -z "${HOSTINGER_API_PATH}" ]; then
            echo "::error::HOSTINGER_PUBLIC_PATH and HOSTINGER_API_PATH must both be configured."
            exit 1
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp >/dev/null

          rm -rf deploy-ftp
          mkdir -p deploy-ftp/frontend
          mkdir -p deploy-ftp/backend

          cp -R frontend/dist/. deploy-ftp/frontend/
          rsync -a \
            --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.example' \
            --exclude 'vendor/' \
            --exclude 'storage/' \
            --exclude 'node_modules/' \
            --exclude 'bootstrap/cache/' \
            --exclude 'tests/' \
            backend/ deploy-ftp/backend/

          lftp -e "set ftp:ssl-allow no; set ssl:verify-certificate false; open ${HOSTINGER_FTP_HOST}; user ${HOSTINGER_FTP_USERNAME} ${HOSTINGER_FTP_PASSWORD}; mkdir -p ${HOSTINGER_PUBLIC_PATH}; mkdir -p ${HOSTINGER_API_PATH}; mirror -R --delete --parallel=10 --exclude-glob .git --exclude-glob .env --exclude-glob .env.example --exclude-glob vendor --exclude-glob storage --exclude-glob node_modules --exclude-glob tests --exclude-glob bootstrap/cache deploy-ftp/frontend ${HOSTINGER_PUBLIC_PATH}; mirror -R --delete --parallel=10 --exclude-glob .git --exclude-glob .env --exclude-glob .env.example --exclude-glob vendor --exclude-glob storage --exclude-glob node_modules --exclude-glob tests --exclude-glob bootstrap/cache deploy-ftp/backend ${HOSTINGER_API_PATH}; bye"

      - name: Post deployment note
        run: |
          echo "FTP deployment has started. The upload is reduced to the app files only, excluding vendor and storage to keep Hostinger uploads fast and reliable."
          echo "Make sure the live .env on Hostinger contains the correct MySQL values."
